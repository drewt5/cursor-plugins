name: Pstack portability
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pstack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Pstack host matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Validate the complete tested-host matrix
        id: matrix
        run: node pstack/scripts/host-matrix.mjs
  portable:
    name: Pstack portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PSTACK_CHECK: portable-${{ matrix.os }}
      PSTACK_ARTIFACT: pstack-portable-${{ matrix.os }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: runtime
        with:
          node-version: 20
      - name: Unit, lifecycle, and package checks
        id: unit
        run: node pstack/scripts/ci-report.mjs run unit -- node pstack/scripts/test.mjs --unit
      - name: Finalize evidence
        if: always()
        env:
          PSTACK_STEPS: ${{ toJSON(steps) }}
        run: node pstack/scripts/ci-report.mjs finalize unit
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PSTACK_ARTIFACT }}
          path: ${{ runner.temp }}/pstack-evidence
          if-no-files-found: error
          retention-days: 7
  helpers:
    name: Pstack helpers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PSTACK_CHECK: helpers
      PSTACK_ARTIFACT: pstack-helpers-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: runtime
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: 1.3.12
      - name: Helper tests and typecheck
        id: helpers
        run: node pstack/scripts/ci-report.mjs run helpers -- node pstack/scripts/test.mjs --helpers
      - name: Finalize evidence
        if: always()
        env:
          PSTACK_STEPS: ${{ toJSON(steps) }}
        run: node pstack/scripts/ci-report.mjs finalize helpers
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PSTACK_ARTIFACT }}
          path: ${{ runner.temp }}/pstack-evidence
          if-no-files-found: error
          retention-days: 7
  native:
    needs: [prepare]
    name: Pstack native (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PSTACK_CHECK: native-${{ matrix.host }}
      PSTACK_HOST: ${{ matrix.host }}
      PSTACK_HOST_VERSION: ${{ matrix.version }}
      PSTACK_ARTIFACT: pstack-native-${{ matrix.host }}-${{ github.run_attempt }}
      HOST_PACKAGE: ${{ matrix.package }}
      HOST_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: runtime
        with:
          node-version: ${{ matrix.node }}
      - name: Install and verify pinned host
        id: setup
        run: node pstack/scripts/ci-report.mjs run setup -- node pstack/scripts/install-host.mjs
      - name: Native skill and agent discovery
        id: discovery
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node pstack/scripts/ci-report.mjs run discovery -- node pstack/scripts/check-hosts.mjs "$PSTACK_HOST"
      - name: Native invocation through the local fixture
        id: invocation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node pstack/scripts/ci-report.mjs run invocation -- node pstack/scripts/check-invocation.mjs "$PSTACK_HOST"
      - name: Finalize evidence
        if: always()
        env:
          PSTACK_STEPS: ${{ toJSON(steps) }}
        run: node pstack/scripts/ci-report.mjs finalize setup discovery invocation
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PSTACK_ARTIFACT }}
          path: ${{ runner.temp }}/pstack-evidence
          if-no-files-found: error
          retention-days: 7
  required:
    name: Pstack required
    if: always()
    needs: [prepare, portable, helpers, native]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require every job group to succeed
        env:
          PSTACK_NEEDS: ${{ toJSON(needs) }}
        run: node pstack/scripts/ci-report.mjs gate
